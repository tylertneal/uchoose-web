name: iPhone test

# Opens the site in WebKit (Safari's engine) at iPhone size with a test
# location and real restaurant data, and saves screenshots of every screen.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "live = the GitHub Pages site, local = this commit served on the runner"
        type: choice
        options: [live, local]
        default: live

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.49.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm i --no-save playwright@1.49.0
      - name: Serve this commit locally
        if: inputs.target == 'local'
        run: node tests/serve.js > /dev/null 2>&1 &
      - run: node tests/iphone.js
        env:
          HOME: /root
          SITE_URL: ${{ inputs.target == 'local' && 'http://127.0.0.1:8080/' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshots
          path: test-results
